<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitud de libro - Intento 2</title>
</head>

<body>

    <header>
        <h1>Librería Mars</h1>
    </header>

    <main>

        <section>
            <h2>Solicita un libro</h2>

            <form action="#" method="post">

                <fieldset>
                    <legend>Información del solicitante</legend>

                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <br><br>

                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" required>

                    <br><br>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">

                    <br><br>

                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" max="5">

                </fieldset>

                <br>

                <label for="libro">Libro solicitado:</label>

                <select id="libro" name="libro">
                    <option value="">Selecciona un libro</option>
                    <option value="gato">El gato que venía del cielo</option>
                    <option value="francotirador">El francotirador paciente</option>
                    <option value="mujercitas">Mujercitas</option>
                </select>

                <br><br>

                <label for="comentarios">Comentarios:</label>

                <br>

                <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>

                <br><br>

                <input type="submit" value="Enviar">

            </form>

        </section>

    </main>

    <footer>
        <p>Librería Mars</p>
    </footer>

</body>
</html>
